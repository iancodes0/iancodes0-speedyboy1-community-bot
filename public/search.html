<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f8fc">
    <title>Search results · Orbit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="results-page">
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Orbit Search home">
          <span class="brand-mark"><span></span><span></span><span></span></span>
          <span>orbit<span class="brand-dot">.</span></span>
        </a>
        <nav>
          <a href="/about">About us</a>
          <a href="https://duckduckgo.com/privacy" target="_blank" rel="noreferrer">Privacy</a>
          <button class="icon-button" id="theme-toggle" aria-label="Toggle color theme">◐</button>
        </nav>
      </header>

      <main>
        <form class="search-form compact-search" id="search-form" role="search">
          <span class="search-icon">⌕</span>
          <input id="search-input" name="q" autocomplete="off" placeholder="Search anything..." aria-label="Search the web">
          <button class="clear-button" id="clear-button" type="button" aria-label="Clear search">×</button>
          <button class="search-button" type="submit">Search <span>↗</span></button>
        </form>

        <nav class="search-tabs" aria-label="Search type">
          <a class="active" href="#" data-tab="web">⌕ All</a>
          <a href="#" data-tab="images">▧ Images</a>
          <a href="/about">About Orbit</a>
        </nav>

        <section class="results-section" id="results-section">
          <div class="results-meta"><span id="results-label">Searching the web…</span><span id="result-count"></span></div>
          <div id="results"></div>
        </section>
        <section class="image-results" id="image-results" hidden></section>
      </main>

      <footer><span>Orbit Search</span><span>Results powered by DuckDuckGo</span><span>Built by Karaas Botros</span></footer>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
