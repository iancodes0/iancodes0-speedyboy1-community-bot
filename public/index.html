<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f8fc">
    <title>Orbit Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Orbit Search home">
          <span class="brand-mark"><span></span><span></span><span></span></span>
          <span>orbit<span class="brand-dot">.</span></span>
        </a>
        <nav>
          <a href="/about">About us</a>
          <a href="https://duckduckgo.com/privacy" target="_blank" rel="noreferrer">Privacy</a>
          <button class="icon-button" id="theme-toggle" aria-label="Toggle color theme">◐</button>
        </nav>
      </header>

      <main>
        <section class="hero" id="hero">
          <div class="eyebrow"><span class="pulse"></span> A calmer way to search</div>
          <h1>Find your next<br><em>great idea.</em></h1>
          <p class="hero-copy">Search the web with less noise and more signal.</p>
        </section>

        <form class="search-form" id="search-form" role="search">
          <span class="search-icon">⌕</span>
          <input id="search-input" name="q" autocomplete="off" placeholder="Search anything..." aria-label="Search the web">
          <button class="clear-button" id="clear-button" type="button" aria-label="Clear search">×</button>
          <button class="search-button" type="submit">Search <span>↗</span></button>
        </form>

        <div class="suggestions" id="suggestions" aria-label="Suggested searches">
          <button type="button" data-query="best places to travel in 2026">Best places to travel in 2026</button>
          <button type="button" data-query="how does solar energy work">How does solar energy work?</button>
          <button type="button" data-query="learn javascript">Learn JavaScript</button>
        </div>
        <a class="creator-note" href="/about"><span>✦</span> Orbit was made by Karaas Botros — see why it exists <b>↗</b></a>

        <section class="results-section" id="results-section" hidden>
          <div class="results-meta"><span id="results-label"></span><span id="result-count"></span></div>
          <div id="results"></div>
        </section>
      </main>

      <footer><span>Orbit Search</span><span>Results powered by DuckDuckGo</span><span>Built by Karaas Botros</span></footer>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
